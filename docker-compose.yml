services:
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: aichat-chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aichat-network

  mysql:
    image: mysql:8.0
    container_name: aichat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ai_chat_db
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aichat-network

  app:
    build: .
    container_name: aichat-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-}
      QIANFAN_API_KEY: ${QIANFAN_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aichat.com}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_URL_PREFIX: ${S3_URL_PREFIX:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_chat_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      CHROMADB_URL: http://chromadb:8000
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - uploads_images:/app/uploads/images
      - uploads_userpic:/app/uploads/userPic
      - uploads_kb:/app/uploads/kb
    networks:
      - aichat-network

volumes:
  chroma_data:
  mysql_data:
  uploads_images:
  uploads_userpic:
  uploads_kb:

networks:
  aichat-network:
    driver: bridge
