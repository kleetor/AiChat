services:
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: aichat-chromadb
    restart: always
    ports:
      - "8000:8000"
    mem_limit: 384m
    mem_reservation: 256m
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aichat-network

  mysql:
    image: mysql:8.0
    container_name: aichat-mysql
    restart: always
    mem_limit: 1024m
    mem_reservation: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_DATABASE: ai_chat_db
      TZ: Asia/Shanghai
    # 如无需从宿主机直接连 MySQL，可将 ports 整行注释
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aichat-network

  app:
    build: .
    container_name: aichat-app
    restart: always
    ports:
      - "8080:8080"
    mem_limit: 1536m
    mem_reservation: 768m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MaxRAMPercentage=60"
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      QIANFAN_API_KEY: ${QIANFAN_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      MEMORY_LLM_API_URL: ${MEMORY_LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      MEMORY_LLM_MODEL_NAME: ${MEMORY_LLM_MODEL_NAME:-deepseek-chat}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.man8out.xyz,http://localhost:5173,http://localhost:8080}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_URL_PREFIX: ${S3_URL_PREFIX:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_chat_db?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=Asia/Shanghai
      CHROMADB_URL: http://chromadb:8000
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - uploads_images:/app/uploads/images
      - uploads_userpic:/app/uploads/userPic
      - uploads_kb:/app/uploads/kb
      - uploads_random_covers:/app/uploads/random-covers
      - uploads_storepic:/app/uploads/Storepic
      - uploads_upstorepic:/app/uploads/upStorepic
    networks:
      - aichat-network

volumes:
  chroma_data:
  mysql_data:
  uploads_images:
  uploads_userpic:
  uploads_kb:
  uploads_random_covers:
  uploads_storepic:
  uploads_upstorepic:

networks:
  aichat-network:
    driver: bridge
