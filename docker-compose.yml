services:
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: aichat-chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1.0"
    networks:
      - aichat-network

  mysql:
    image: mysql:8.0
    container_name: aichat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ai_chat_db
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: "1.0"
    networks:
      - aichat-network

  app:
    build:
      context: .
      args:
        JAR_FILE: ${JAR_FILE:-target/aichat-0.0.1-SNAPSHOT.jar}
    container_name: aichat-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      # JVM 调优（可覆盖 Dockerfile 默认值）
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -XX:+UseZGC -XX:MaxGCPauseMillis=50}
      # 数据库
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_chat_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      # JWT
      JWT_SECRET: ${JWT_SECRET:-}
      # 搜索 API
      QIANFAN_API_KEY: ${QIANFAN_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # 嵌入模型
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      MEMORY_LLM_API_URL: ${MEMORY_LLM_API_URL:-https://api.deepseek.com/v1/chat/completions}
      MEMORY_LLM_MODEL_NAME: ${MEMORY_LLM_MODEL_NAME:-deepseek-chat}
      # 图片识别
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      # AES 加密密钥
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # 邮件
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 管理员
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aichat.com}
      # S3 存储
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_URL_PREFIX: ${S3_URL_PREFIX:-}
      # ChromaDB 内网地址
      CHROMADB_URL: http://chromadb:8000
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    mem_limit: 1g
    cpus: "2.0"
    volumes:
      - uploads_images:/app/uploads/images
      - uploads_userpic:/app/uploads/userPic
      - uploads_kb:/app/uploads/kb
    networks:
      - aichat-network

volumes:
  chroma_data:
  mysql_data:
  uploads_images:
  uploads_userpic:
  uploads_kb:

networks:
  aichat-network:
    driver: bridge
