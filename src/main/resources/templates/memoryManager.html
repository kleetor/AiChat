<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆管理 - HanaChat</title>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/memory.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="header">
    <h1><i data-lucide="brain"></i> 记忆管理</h1>
    <div class="nav-links">
        <a href="/">← 返回聊天</a>
    </div>
</div>

<div class="container" id="app">
    <!-- 记忆统计 -->
    <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
        <div style="flex:1;min-width:120px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 18px;text-align:center;">
            <div style="font-size:28px;font-weight:700;color:#4f46e5;" id="statTotal">0</div>
            <div style="font-size:12px;color:#9ca3af;">总记忆</div>
        </div>
        <div style="flex:1;min-width:120px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 18px;text-align:center;">
            <div style="font-size:28px;font-weight:700;color:#059669;" id="statEnabled">0</div>
            <div style="font-size:12px;color:#9ca3af;">已启用</div>
        </div>
        <div style="flex:1;min-width:120px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 18px;text-align:center;">
            <div style="font-size:28px;font-weight:700;color:#d97706;" id="statManual">0</div>
            <div style="font-size:12px;color:#9ca3af;">手动添加</div>
        </div>
    </div>

    <!-- 添加记忆栏 -->
    <div class="add-bar">
        <input type="text" id="newMemoryInput" placeholder="输入要让AI记住的信息，如「我的名字是张三」" maxlength="500">
        <button class="btn-primary" onclick="MemoryPage.addMemory()"><i data-lucide="plus"></i> 添加</button>
    </div>

    <!-- Tab 切换 -->
    <div class="tabs">
        <button class="active" onclick="MemoryPage.switchTab('all')">全部记忆</button>
        <button onclick="MemoryPage.switchTab('enabled')">已启用</button>
        <button onclick="MemoryPage.switchTab('search')"><i data-lucide="search"></i> 搜索</button>
    </div>

    <!-- 语义搜索栏 (默认隐藏) -->
    <div class="search-bar" id="searchBar" style="display:none;">
        <input type="text" id="searchInput" placeholder="输入关键词搜索记忆，如「用户喜欢什么」" onkeydown="if(event.key==='Enter')MemoryPage.searchMemories()">
        <div class="hint">按 Enter 搜索，基于语义匹配</div>
    </div>

    <!-- 记忆列表 -->
    <div class="section-title" style="margin-top:0;">
        <span id="listTitle">全部记忆</span>
        <div>
            <span class="count" id="listCount"></span>
            <button class="btn-danger" onclick="MemoryPage.clearAll()" style="margin-left:10px;"><i data-lucide="trash-2"></i> 清空全部</button>
        </div>
    </div>
    <div class="mem-list" id="memList">
        <div class="loading">加载中...</div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3><i data-lucide="edit"></i> 编辑记忆</h3>
        <textarea id="editText"></textarea>
        <div class="btn-row">
            <button class="btn-secondary" onclick="MemoryPage.closeEdit()">取消</button>
            <button class="btn-primary" onclick="MemoryPage.saveEdit()">保存</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/common.js"></script>
<script src="/api-paths.js"></script>
<script src="/memory.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
